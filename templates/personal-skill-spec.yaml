# Personal Skill 登记模板
#
# 目录结构：
# personal/
# └── <作者名>/
#     └── skill.yaml
#     └── <skill-name>/              # 可选：单独上传的 Skill 目录
#         └── SKILL.md
#
# 使用方法：
# 1. 每位作者使用独立目录：personal/<作者名>/skill.yaml。
# 2. 作者信息只在顶层填写一次，不需要在每个仓库中重复填写。
# 3. `skill_repos` 用于登记整个仓库，扫描仓库内全部 SKILL.md。
# 4. 单个 Skill 两种登记方式任选其一：上传到当前个人目录下的`<skill-name>/` 中，
#    或通过 `skills` 登记 SKILL.md 文件 URL；
# 5. `skill_repos` 和 `skills` 可以同时使用；没有对应内容时填写空数组 []。
# 6. 同一个仓库或 Skill 不要重复登记。
# 7. 只填写作者愿意公开的信息；未公开的信息直接省略，不要猜测。
# 8. YAML 统一使用 2 个空格缩进，不要使用 Tab。
#
# 字段说明：
# | 一级字段      | 二级字段     | 必填 | 说明                                       |
# | ------------- | ------------ | ---- | ------------------------------------------ |
# | author        | -            | 必填 | 作者显示名称（用户名或姓名）               |
# | description   | -            | 可选 | 作者简介                                   |
# | profile       | -            | 可选 | 作者在代码托管平台上的公开主页             |
# | website       | -            | 可选 | 作者个人网站或博客                         |
# | email         | -            | 可选 | 作者公开联系邮箱；请确认愿意公开后再填写   |
# | organization  | -            | 可选 | 作者所属企业、学校、社区或其他组织         |
# | location      | -            | 可选 | 作者公开所在地                             |
# | skill_repos[] | -            | 可选 | 仓库级 Skill 登记列表；扫描器会发现仓库中全部符合规范的 SKILL.md |
# |               | url          | 必填 | 仓库 URL（skill_repos 非空时必填）         |
# |               | branch       | 可选 | 扫描分支；不填写时使用仓库默认分支         |
# | skills[]      | -            | 可选 | 单个 Skill 登记列表；适用于只登记某个 Skill，而不是扫描整个仓库 |
# |               | skill_name   | 必填 | Skill 名称（skills 非空时必填）             |
# |               | skill_url    | 必填 | Skill 文件的完整 URL（skills 非空时必填）   |
# |               | description  | 建议 | Skill 的简要用途说明                        |
# |               | category     | 可选 | Skill 所属分类；取值来自 templates/skill-spec.yaml 的 categories |

author: 用户名或姓名
# description: openEuler 社区开发者，关注智能体与操作系统技术。
# profile: https://gitcode.com/用户名
# website: https://example.com
# email: name@example.com
# organization: Example Organization
# location: 中国

# 没有仓库级登记时填写 `skill_repos: []`。
skill_repos:
  - url: https://gitcode.com/用户名/仓库名
    # branch: main

# 没有单个 Skill 时填写 `skills: []`。
skills:
  - skill_name: skill-name
    skill_url: https://gitcode.com/用户名/仓库名/blob/main/skills/skill-name/SKILL.md
    # description: 用于完成某类任务的 Agent Skill
    # category: Development and Build
